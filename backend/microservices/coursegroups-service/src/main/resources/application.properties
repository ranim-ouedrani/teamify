spring.application.name=course-group-service
# PORT A CONFIRMER avec l'equipe (valeur par defaut provisoire)
server.port=${SERVER_PORT:8085}

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:course_group_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Spring Cloud (desactive tant que l'infrastructure n'est pas disponible) ---
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.config.enabled=${CONFIG_ENABLED:false}

# --- Swagger / OpenAPI ---
# UI : http://localhost:8085/swagger-ui.html   |   JSON : http://localhost:8085/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
